name: Test LTS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/TestLTS.yml'

permissions:
  actions: write # lets julia-actions/cache delete outdated caches
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # keep the other jobs running if one fails
      matrix:
        julia-version: ['lts']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest]
        experimental: [false]

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }} # 'lts' is the current long-term support release
          arch: ${{ matrix.julia-arch }}

      - name: "Set up julia-cache" # caches packages, artifacts and precompiled files
        uses: julia-actions/cache@v3

      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1

      - name: "Run tests"
        uses: julia-actions/julia-runtest@v1
