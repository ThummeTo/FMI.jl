name: CompatHelper

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: "Install CompatHelper"
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'

      - name: "Run CompatHelper"
        run: julia -e 'using CompatHelper; CompatHelper.main()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SSH deploy key, so CompatHelper's PRs trigger the other workflows (see README.md in this folder).
          # Falls back to DOCUMENTER_KEY in repos without a COMPATHELPER_PRIV secret.
          COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV || secrets.DOCUMENTER_KEY }}
